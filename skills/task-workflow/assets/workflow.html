<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>Workflow</title>
<style>
:root{color-scheme:light dark;--background:#fff;--surface:#f4f5f6;--text:#202124;--muted:#687078;--border:#dce0e4;--accent:#286447;--safe-top:0px;--safe-right:0px;--safe-bottom:0px;--safe-left:0px;font-family:var(--font-sans,system-ui,sans-serif);font-size:13px}
:root[data-theme="dark"]{--background:#191b1d;--surface:#24272a;--text:#eef0f1;--muted:#b3bac0;--border:#454a50;--accent:#99d3b1}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--background:#191b1d;--surface:#24272a;--text:#eef0f1;--muted:#b3bac0;--border:#454a50;--accent:#99d3b1}}
*{box-sizing:border-box}body{margin:0;background:var(--color-background-primary,var(--background));color:var(--color-text-primary,var(--text))}main{max-width:860px;margin:auto;padding:calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left))}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:19px;letter-spacing:-.3px;margin:0;line-height:1.3;overflow-wrap:anywhere;min-width:0}p{line-height:1.5;margin:6px 0 0;color:var(--color-text-secondary,var(--muted));font-size:12px;overflow-wrap:anywhere}button{font:inherit;font-size:20px;color:var(--muted);background:transparent;border:0;border-radius:6px;width:30px;height:30px;padding:0;cursor:pointer;flex-shrink:0}button:hover{background:var(--surface)}button:disabled{cursor:default;opacity:.4}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}
</style>
</head>
<body><main>
<header><h1 id="phase">Loading</h1><button id="refresh" aria-label="Refresh" title="Refresh" disabled>↻</button></header>
<section id="details" hidden aria-label="Current phase detail"></section>
<p id="empty" hidden>Open this task with the agent.</p>
<p id="connection" role="status" aria-live="polite" hidden></p>
</main>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const pending = new Map();
  const versions = ['2026-01-26'];
  let nextId = 1, origin = null, ready = false, canRefresh = false, snapshot = null, context = {}, disposed = false, refreshing = false, automaticPaused = false;
  const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  const text = (tag, value, className) => {const node=document.createElement(tag);node.textContent=String(value ?? 'unknown');if(className)node.className=className;return node;};
  function send(message) {if (!disposed) window.parent.postMessage(message, origin && origin !== 'null' ? origin : '*');}
  function request(method, params) {
    return new Promise((resolve,reject) => {
      const id=nextId++;
      pending.set(id,{resolve,reject});send({jsonrpc:'2.0',id,method,params});
    });
  }
  function status(value) {$('connection').textContent=value;$('connection').hidden=!value;}
  function hostContext(update) {
    if(!isObject(update))return;
    context={...context,...update};
    if(update.theme==='light'||update.theme==='dark')document.documentElement.dataset.theme=update.theme;
    for(const [key,value] of Object.entries(update.styles?.variables||{})) {
      if(/^--(?:color|font)-[a-z0-9-]+$/.test(key)&&typeof value==='string'&&!/url\s*\(|[;{}]/i.test(value))document.documentElement.style.setProperty(key,value);
    }
    for(const side of ['top','right','bottom','left']) {
      const value=context.safeAreaInsets?.[side];
      if(typeof value==='number'&&Number.isFinite(value))document.documentElement.style.setProperty('--safe-'+side,Math.max(0,value)+'px');
    }
  }
  const readable=value=>{const result=String(value||'unknown');return result.charAt(0).toUpperCase()+result.slice(1).replace(/_/g,' ');};
  function phaseState(task) {
    if(task.closure?.status==='complete')return {phase:{completed:'Completed',stopped:'Stopped',abandoned:'Abandoned'}[task.closure.outcome]||'Closed',detail:''};
    const processPhases={exploration:'Exploration',discussion:'Discussion',design:'Design',design_review:'Design review',design_confirmation:'Design confirmation',plan:'Plan',plan_confirmation:'Plan confirmation',delivery:'Delivery'};
    if(task.process_protocol===2&&processPhases[task.stage]&&task.stage!=='delivery')return {phase:processPhases[task.stage],detail:task.phase_detail||''};
    const runs=task.runs||[],running=runs.filter(run=>run.status==='running');
    const stage=task.stage,combined=['implementation','review'].includes(stage)?readable(stage)+' · ':'';
    if(running.length)return {phase:combined+'Running',detail:running[0].run_id+' · Running'+(running.length>1?' · +'+(running.length-1):'')};
    for(const [state,phase] of [['queued','Queued'],['awaiting_artifacts','Awaiting artifacts'],['preparing','Preparing run'],['prepared','Run ready'],['planned','Run planned'],['unknown','Run state unknown']]) {
      const run=runs.find(value=>value.status===state);if(run)return {phase,detail:run.run_id};
    }
    if(task.process_protocol===2&&task.stage==='delivery')return {phase:'Delivery',detail:task.phase_detail||''};
    const phases={enrolled:'Design','design recorded':'Design',approved:'Ready',implementation:'Implementation',review:'Review','verification complete':'Verification complete',integration:'Integration',integrated:'Integrated'};
    const phase=phases[stage]||'State unknown';
    const items=(task.items||[]).filter(item=>item.status===(stage==='review'?'reviewing':'implementing'));
    const detail=['review','implementation'].includes(stage)&&items.length?(items.length===1?items[0].title:items.length+' items '+(stage==='review'?'awaiting review':'in progress')):'';
    return {phase,detail};
  }
  function renderTask() {
    const task=snapshot?.tasks?.[0];
    $('details').replaceChildren();$('details').hidden=!task;$('empty').hidden=!!task;
    if(!task){$('phase').textContent='Unbound';return;}
    const current=phaseState(task);$('phase').textContent=current.phase;
    if(current.detail)$('details').append(text('p',current.detail));
  }
  function accept(result) {
    if(!isObject(result)||result.isError)throw new Error('unavailable');
    const data=result.structuredContent;
    if(!isObject(data)||data.schema_version!==1||!Array.isArray(data.tasks)||data.tasks.length>1)throw new Error('unsupported data');
    snapshot=data;automaticPaused=false;
    $('refresh').disabled=!canRefresh||!data.view_ref;
    $('empty').textContent=data.reason==='context_required'?'Open this task with the agent.':'Ask the agent to reopen this task.';
    status(canRefresh?'':'Reopen Workflow to refresh on this host.');renderTask();
  }
  async function refresh(automatic=false) {
    if(automatic&&automaticPaused)return;
    if(!ready||!canRefresh||!snapshot?.view_ref||refreshing)return;
    refreshing=true;
    $('refresh').disabled=true;
    try{accept(await request('tools/call',{name:'workflow.refresh_view',arguments:{view_ref:snapshot.view_ref}}));}
    catch{automaticPaused=true;status('Refresh unavailable · showing saved state');}
    finally{refreshing=false;$('refresh').disabled=!canRefresh||!snapshot?.view_ref;}
  }
  function receive(event) {
    if(event.source!==window.parent||!isObject(event.data)||event.data.jsonrpc!=='2.0')return;
    if(origin!==null&&event.origin!==origin)return;
    const message=event.data;
    if(Object.hasOwn(message,'id')&&!message.method){
      const call=pending.get(message.id);if(!call)return;
      if(origin===null)origin=event.origin;
      pending.delete(message.id);
      if(message.error)call.reject(new Error('host error'));else if(isObject(message.result))call.resolve(message.result);else call.reject(new Error('invalid response'));
      return;
    }
    if(!ready)return;
    if(message.method==='ui/notifications/tool-result'){try{accept(message.params);}catch{status('Workflow data is unavailable or unsupported. Refresh to retry.');}}
    else if(message.method==='ui/notifications/host-context-changed')hostContext(message.params);
    else if(message.method==='ui/notifications/tool-cancelled')status('Read cancelled. Refresh to retry.');
    else if(message.method==='ui/resource-teardown'&&Object.hasOwn(message,'id')){
      send({jsonrpc:'2.0',id:message.id,result:{}});disposed=true;clearInterval(refreshTimer);
      for(const call of pending.values()){call.reject(new Error('closed'));}pending.clear();window.removeEventListener('message',receive);
    }
  }
  window.addEventListener('message',receive);
  $('refresh').addEventListener('click',()=>refresh());
  async function initialize() {
    try {
      const result=await request('ui/initialize',{protocolVersion:versions[0],appInfo:{name:'Workflow',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}});
      if(!versions.includes(result.protocolVersion)){status('This host uses an unsupported app protocol. Update the host app and reopen Workflow.');return;}
      hostContext(result.hostContext);
      ready=true;send({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}});
      const desktop=result.hostContext?.platform==='desktop';
      const build=String(result.hostInfo?.version||'').match(/^(\d+)\.(\d+)\.(\d+)/);
      const minimum=[26,928,20710];
      const older=build&&minimum.some((v,i)=>Number(build[i+1])<v&&minimum.slice(0,i).every((p,j)=>Number(build[j+1])===p));
      canRefresh=isObject(result.hostCapabilities?.serverTools)&&!(desktop&&older);
      $('refresh').disabled=!canRefresh||!snapshot?.view_ref;
      status(canRefresh?'':desktop&&older?'Update this app to refresh.':'Reopen Workflow to refresh.');
    } catch {status('Workflow could not connect to this host. Reopen this tab to retry.');}
  }
  const refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')refresh(true);},10000);
  initialize();
})();
</script></body></html>
